name: Build, Test & Publish to GHCR
 
on:
  push:
    branches: [master]
    paths:                      # ← only run when CODE changes (see below)
      - 'Pos.Api/**'
      - 'Pos.Test/**'
      - 'Pos.slnx'
      - 'Pos.Api/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'
  workflow_dispatch:          # manual trigger from GitHub UI (Actions tab)

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # ← REQUIRED: lets GITHUB_TOKEN push to GHCR

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify app version (csproj ↔ FRD)
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content 'Pos.Api/Pos.Api.csproj'
          $csprojVersion = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $frdHeader = (Get-Content 'Pos.Api/Document/FRD.md' -TotalCount 2)[1]
          if ($frdHeader -notmatch 'App Version\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "FRD header has no 'App Version X.Y.Z' token: $frdHeader"
          }
          $frdVersion = $Matches[1]
          if ($csprojVersion -ne $frdVersion) {
            throw "Version drift: Pos.Api.csproj <Version>=$csprojVersion but FRD 'App Version'=$frdVersion"
          }
          Write-Host "App version OK: $csprojVersion"
 
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
 
      - name: Restore
        run: dotnet restore Pos.slnx
 
      - name: Build
        run: dotnet build Pos.slnx --configuration Release --no-restore
 
      - name: Run tests
        run: dotnet test Pos.Test/Pos.Test.csproj --configuration Release --no-build
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/christianj27/pos-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value=1.0.${{ github.run_number }}
 
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Pos.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-test-push        # only deploy if build+push succeeded
    runs-on: ubuntu-latest
    environment: production       # optional: adds approval gate
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
 
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          appName: pos-api
          resourceGroup: pos-rg
          imageToDeploy: ghcr.io/christianj27/pos-api:1.0.${{ github.run_number }}
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}